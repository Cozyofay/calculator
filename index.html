<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
</head>
<body>
    <link rel="stylesheet" href="style.css">
    <div id="container">
        <div contenteditable="true" class="text" id="content"></div>
        <div class="btnCont">
            <div class="numbers cont" id="clear">AC</div>
            <div class="numbers cont" id="del">Del</div>
            <div class="numbers cont" id="perc">%</div>
            <div class="numbers sign" id="divide">/</div>
            <div class="numbers"id="seven">7</div>
            <div class="numbers"id="eight">8</div>
            <div class="numbers"id="nine">9</div>
            <div class="numbers sign" id="prod">*</div>
            <div class="numbers"id="four">4</div>
            <div class="numbers"id='five'>5</div>
            <div class="numbers"id='six'>6</div>
            <div class="numbers sign" id='minus'>-</div>
            <div class="numbers"id='one'>1</div>
            <div class="numbers"id='two'>2</div>
            <div class="numbers"id="three">3</div>
            <div class="numbers sign" id="plus">+</div>
            <div class="numbers"id="zero">0</div>
            <div class="numbers"id="comma">.</div>
            <div class="numbers sign" id="calc">=</div>

        </div>
        
    </div>
</body>
</html>
